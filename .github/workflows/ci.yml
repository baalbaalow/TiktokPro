name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Node / npm versions
        run: |
          node --version
          npm --version
      - name: Install Node deps (tolerant)
        run: |
          npm ci || npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  python-check:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install Python deps (may be large)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python compile check
        run: python -m py_compile tiktok_remix_pro.py
